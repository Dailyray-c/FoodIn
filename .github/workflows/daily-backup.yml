name: Daily Inventory Backup

on:
  workflow_dispatch: # 主触发：由 cron-job.org 定时调用（与 daily-expiry-check 一致，避开 GitHub schedule 延迟）
  schedule:
    - cron: "30 20 * * *"   # 备用触发：每天 20:30 UTC = 次日 04:30 北京时间（备份任务延迟影响小）

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup script
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
        run: python scripts/daily_backup.py

      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain backups/)" ]; then
            git add backups/
            git commit -m "chore: daily inventory backup [skip ci]"
            git push
            echo "Backup committed."
          else
            echo "No changes to backup (same-day rerun or data unchanged)."
          fi
